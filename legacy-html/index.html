<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fichário Inteligente — Identificação</title>
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>

<div class="tela-central">
  <div class="painel-identificacao">
    <span class="logo-dot"></span>
    <h1>Fichário Inteligente</h1>
    <p class="sub">Informe seu nome e CPF para começar (ou continuar) os módulos do curso.</p>

    <form id="form-identificacao" novalidate>
      <div class="campo" id="campo-nome">
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" name="nome" placeholder="Ex: Marcos Dourado" autocomplete="name" />
        <div class="erro">Digite seu nome completo.</div>
      </div>

      <div class="campo" id="campo-cpf">
        <label for="cpf">CPF</label>
        <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" inputmode="numeric" maxlength="14" />
        <div class="erro">Digite um CPF válido.</div>
      </div>

      <button type="submit" class="btn btn-primario">Começar módulos</button>
    </form>
  </div>
</div>

<script src="assets/app.js"></script>
<script>
  const form = document.getElementById("form-identificacao");
  const campoNome = document.getElementById("nome");
  const campoCpf = document.getElementById("cpf");

  // Se já existe uma sessão ativa nesta aba, pula direto pros módulos.
  const sessaoAtual = obterSessao();
  if (sessaoAtual) {
    window.location.href = "modulos.html";
  }

  campoCpf.addEventListener("input", () => {
    campoCpf.value = formatarCPF(campoCpf.value);
  });

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    let valido = true;

    const nome = campoNome.value.trim();
    const cpf = campoCpf.value.trim();

    document.getElementById("campo-nome").classList.toggle("invalido", nome.length < 3);
    document.getElementById("campo-cpf").classList.toggle("invalido", !cpfValido(cpf));

    if (nome.length < 3) valido = false;
    if (!cpfValido(cpf)) valido = false;

    if (!valido) return;

    salvarSessao(nome, cpf);
    semearDadosDemo();
    window.location.href = "modulos.html";
  });
</script>

</body>
</html>
